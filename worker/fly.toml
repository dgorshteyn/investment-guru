# Fly.io config for the Investment Guru worker.
# Deploy with: fly launch --no-deploy  (first time), then `fly deploy`.

app = "investment-guru-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"        # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
